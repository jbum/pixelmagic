<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QTS – Pixel Magic in the browser</title>
<meta name="description" content="QTS: Jim Bumgardner's Pixel Magic / QuickTime Synthesizer (1995–2003) running in the browser. Write a formula per pixel, add time, render stills and movies.">
<meta property="og:title" content="QTS – Pixel Magic in the browser">
<meta property="og:description" content="A formula for every pixel, plus time: stills and movies, rendered in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://qts.jbum.com/">
<meta property="og:image" content="https://qts.jbum.com/assets/card.png?v=1">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="./">QTS</a> <small>Pixel Magic in the browser</small></h1>
  <nav>
    <select id="examples"><option value="">Examples…</option></select>
    <button id="gallery-open">Gallery</button>
    <button id="new">New</button>
    <button id="open">Open…</button>
    <button id="save">Save</button>
    <button id="images" title="Add images for image=&quot;…&quot;">Images…</button>
    <button id="help">Language</button>
    <a class="about" href="about.html">About</a>
  </nav>
</header>

<main>
  <section class="editor">
    <div class="row">
      <input id="name" value="untitled.can" spellcheck="false" aria-label="script name">
      <button id="render" class="primary" title="⌘/Ctrl + Enter">Render frame</button>
    </div>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
    <div id="log" aria-live="polite"></div>
  </section>

  <section class="view">
    <div class="tabs" role="tablist">
      <button id="tabShader" class="on" role="tab" title="the script compiled to a GLSL shader, playing live on the GPU">Live shader</button>
      <button id="tabFrame" role="tab" title="one frame from the original renderer (WebAssembly, every core): exact, and for devices without a usable GPU">Frame</button>
    </div>
    <div class="canvasWrap"><canvas id="preview" width="256" height="256"></canvas><canvas id="glview" width="256" height="256" hidden></canvas></div>
    <div class="timeRow">
      <input type="range" id="time" min="0" max="1" step="0.0005" value="0" aria-label="time">
      <span id="timeText"></span>
    </div>
    <div class="row controls">
      <label><input type="checkbox" id="autoRender" checked> render as the slider moves</label>
      <label>size <input id="width" type="number" min="1" max="4096" placeholder="w"> × <input id="height" type="number" min="1" max="4096" placeholder="h">
        <button id="sizeReset" title="back to the script's fw/fh">↺</button></label>
    </div>
    <div class="row" id="shaderButtons" hidden>
      <button id="shaderPlay" class="primary">Pause</button>
      <label><input type="checkbox" id="shaderOversample" checked> oversample</label>
      <button id="saveShaderHtml" title="a page that plays the loop, with the shader and images inside">Save shader (HTML)</button>
      <button id="saveShaderGlsl" title="the fragment shader alone, in Shadertoy's dialect">Save GLSL</button>
      <span id="shaderFps" class="dim"></span>
    </div>
    <div class="row">
      <button id="savePng">Save frame (PNG)</button>
      <button id="movie" class="primary">Render movie…</button>
      <button id="movieCancel" hidden>Cancel</button>
    </div>
    <div class="statusRow"><span id="status"></span><progress id="progress" max="1" value="0" hidden></progress></div>
  </section>
</main>

<div id="galleryPanel" hidden>
  <div class="galleryHead">
    <h2>Examples from the QTS archive (2001–2003)</h2>
    <button id="galleryClose">Close</button>
  </div>
  <p class="featured">
    <a href="about.html#etude">Noise Etude</a> (2001, 131 s) is the long piece: watch it on the About page, or open
    <a href="?x=noiseetude.can">noiseetude.can</a> here and render it yourself.
  </p>
  <div id="gallery" class="grid"></div>
</div>

<dialog id="movieDialog">
  <h2>Render movie</h2>
  <p id="movieInfo"></p>
  <p>
    <label>Render with
      <select id="movieEngine">
        <option value="gpu">the shader (GPU: fast)</option>
        <option value="cpu">the original renderer (CPU: exact)</option>
      </select>
    </label>
    <label>Format
      <select id="movieFormat">
        <option value="mp4">MP4 (H.264)</option>
        <option value="png">PNG frames (zip)</option>
      </select>
    </label>
  </p>
  <p>
    <label><input type="radio" name="movieRange" id="movieAll" checked> every frame</label>
    <label><input type="radio" name="movieRange" id="movieSome"> frames
      <input id="movieFirst" type="number" min="1" value="1"> to <input id="movieLast" type="number" min="1" value="1"></label>
  </p>
  <p class="hint" id="movieHint"></p>
  <p class="buttons"><button id="movieClose">Cancel</button> <button id="movieGo" class="primary">Render</button></p>
</dialog>

<input type="file" id="openFile" accept=".can,.txt,text/plain" hidden>
<input type="file" id="imageFiles" accept="image/*" multiple hidden>

<script type="module" src="app.js"></script>
</body>
</html>
